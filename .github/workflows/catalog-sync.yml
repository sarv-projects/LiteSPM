name: Catalog & Rankings Sync

on:
  schedule:
    # Run daily at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      force_resync:
        description: 'Force re-syncing from all upstream registries'
        required: false
        type: boolean
        default: false

concurrency:
  group: catalog-sync
  cancel-in-progress: false

jobs:
  sync-catalog:
    name: Sync Registries & Refresh Rankings
    runs-on: ubuntu-latest
    # `contents: write` to push the dated sync branch, `pull-requests: write`
    # to open the PR a human reviews. The job never writes to `main` itself.
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The toolchain is whatever go.mod requires (`go 1.26.0`). A hardcoded
      # `go-version: '1.24'` here was the first of the reasons this job never
      # succeeded: `go run ./cmd/litespm` needs a toolchain at least as new as
      # the module's directive. This follows go.mod from now on instead of
      # drifting behind it (AUDIT F12).
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Sync upstream catalog & rank scores
        run: |
          echo "Syncing skills (agentskills.io, skills.sh) and MCP servers (mcpservers.org, registry)..."
          python3 scripts/build_full_catalog.py

      - name: Rebuild materialized catalog release pointer
        run: |
          go run ./cmd/litespm catalog build --out web/public

      - name: Check catalog coherence
        run: |
          python3 scripts/check_catalog_coherence.py

      # The failure point of every previous run of this job: `next build`
      # type-checks the whole app, the app imports the Prisma client, and the
      # client only exists after `prisma generate`. `npm run build` happens to
      # run the generator itself, but relying on that made the dependency
      # invisible; it is a real prerequisite, so it is a real step.
      - name: Install Web Dependencies for the Build Check
        working-directory: ./web
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./web
        run: npx prisma generate

      - name: Verify Web Build
        working-directory: ./web
        run: npm run build

      # The two trees every producer in this job is allowed to write.
      #
      # What the producers actually write, read off the steps above and the
      # repo layout:
      #   scripts/build_full_catalog.py  -> web/data/catalog.json,
      #                                     web/data/release.json
      #   litespm catalog build          -> web/public/v1/current.json, the
      #                                     gitignored web/public/v1/releases/
      #                                     tree, and web/data/release.json
      #                                     (syncReleaseStats writes
      #                                     <outDir>/../data/release.json)
      # Nothing else. The previous revision of this step ran
      # `git add data/ web/public/v1/ web/src/`: `data/` does not exist in this
      # repository (so `git add` failed the job before any commit), and
      # `web/src/` is hand-written site code that no step here regenerates and
      # no step should ever be able to commit on its own.
      - name: Stage the sync output and refuse anything outside the allowlist
        run: |
          set -euo pipefail
          ALLOWED='^(web/data/|web/public/v1/)'

          # Everything git can see as changed, staged or not: the guard is
          # about what the producers wrote, not about what we chose to add.
          # Ignored trees (web/public/v1/releases/, source-snapshots/,
          # web/node_modules/, web/.next/) are excluded by --exclude-standard,
          # which is why the released tree is not listed here.
          changed="$(git ls-files --modified --others --deleted --exclude-standard)"
          if [ -z "$changed" ]; then
            echo "No changes in catalog dataset or rankings."
            exit 0
          fi

          outside="$(printf '%s\n' "$changed" | grep -Ev "$ALLOWED" || true)"
          if [ -n "$outside" ]; then
            {
              echo "::error title=Sync wrote outside its allowlist::This job may only publish web/data/ and web/public/v1/. These paths changed too:"
              printf '  %s\n' "$outside"
              echo "A path above is either a producer reaching outside its lane or scratch this job left behind. Publish it under one of the two trees, or extend the allowlist in this workflow deliberately — do not let it ride along in an unreviewed data PR."
            } >&2
            exit 1
          fi

          git add -- web/data web/public/v1
          echo "Changed paths (all inside the allowlist):"
          git diff --cached --name-only | sed 's/^/  /'
          git diff --cached --stat | tail -1

      # The old revision pushed straight to `main`: a daily, unattended,
      # unreviewed write into the branch that every release signs. Now the same
      # bytes go to a dated branch and a PR.
      #
      # Residual, and it is a real one: GitHub does not start workflow runs for
      # pushes or pull requests created with the repository's own GITHUB_TOKEN,
      # so a PR opened that way arrives with no CI checks attached. Review the
      # diff (the PR body carries the dataset numbers and the per-file stat),
      # and if you want the checks too, push any commit to the branch — a human
      # push does start them — or run CI against it manually.
      #
      # Second residual, and this one blocks the step outright until a human
      # changes a repository setting: `gh pr create` with GITHUB_TOKEN needs
      # Settings → Actions → General → Workflow permissions → "Allow GitHub
      # Actions to create and approve pull requests". This repository has that
      # OFF (`/repos/{owner}/{repo}/actions/permissions/workflow` reports
      # `can_approve_pull_request_reviews: false`), and no action works around it
      # — `@peter-evans/create-pull-request` uses the same token and hits the
      # same refusal, so one was deliberately not added. Set the
      # CATALOG_SYNC_TOKEN secret to a PAT or GitHub App token instead to lift
      # the dependency (and get CI checks on the PR as a bonus), or enable the
      # setting.
      - name: Commit the sync to a dated branch and open a review PR
        env:
          GH_TOKEN: ${{ secrets.CATALOG_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$(git diff --cached --name-only)" ]; then
            echo "No changes in catalog dataset or rankings."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="catalog-sync/$(date -u +%Y-%m-%d)"
          TITLE="chore(catalog): automated sync $(date -u +%Y-%m-%d)"

          # A reviewer should not have to run the producers to know what
          # arrived: the body carries the dataset numbers and the diff stat.
          python3 - > "$RUNNER_TEMP/sync-summary.md" <<'PY'
          import json
          import pathlib
          import subprocess

          def load(path):
              candidate = pathlib.Path(path)
              return json.loads(candidate.read_text(encoding="utf-8")) if candidate.exists() else None

          rows = load("web/data/catalog.json") or []
          release = load("web/data/release.json") or {}
          pointer = load("web/public/v1/current.json") or {}
          kinds = {}
          for row in rows:
              kind = row.get("kind", "unknown")
              kinds[kind] = kinds.get(kind, 0) + 1
          stat = subprocess.run(
              ["git", "diff", "--cached", "--stat"],
              capture_output=True, text=True, check=True,
          ).stdout.strip()

          print("Automated daily catalog sync (`.github/workflows/catalog-sync.yml`), for review.")
          print()
          print("Producers in this run, and everything they write:")
          print()
          print("- `scripts/build_full_catalog.py` -> `web/data/catalog.json`, `web/data/release.json`")
          print("- `litespm catalog build --out web/public` -> `web/public/v1/current.json`, `web/data/release.json` (release identity)")
          print()
          print("Those two trees are the workflow's allowlist: a change anywhere else fails the job before it stages anything, so this diff cannot contain one.")
          print()
          print("| field | value |")
          print("| --- | --- |")
          print(f"| listings | {len(rows)} |")
          print(f"| by kind | {', '.join(f'{kind}: {count}' for kind, count in sorted(kinds.items()))} |")
          print(f"| released tree | {pointer.get('releaseId', 'unknown')} (sequence {pointer.get('sequence', 'unknown')}) |")
          print(f"| manifest digest | {pointer.get('manifestDigest', 'unknown')} |")
          print(f"| dataset digest | {release.get('datasetDigest', 'unknown')} |")
          print(f"| stats updated | {release.get('statsUpdatedAt', 'unknown')} |")
          print()
          print("```")
          print(stat)
          print("```")
          print()
          print("Opened by the scheduled job, not by a person. Close it if the upstream data moved in a way the dataset should not have followed.")
          PY

          git checkout -B "$BRANCH"
          git commit -m "chore(catalog): automated sync of skills, mcps, and rankings"

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            # A re-run of the same day refreshes the branch (and therefore the
            # PR) instead of opening a second one for the same data.
            git push --force origin "HEAD:refs/heads/$BRANCH"
          else
            git push -u origin "$BRANCH"
          fi

          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/sync-summary.md"
            echo "Updated the existing PR for $BRANCH."
          elif ! gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/sync-summary.md"; then
            {
              echo "::error title=Could not open the catalog sync PR::gh pr create failed. Branch $BRANCH is pushed, so the data is still reviewable as a branch diff."
              echo "If the failure says GitHub Actions is not permitted to create or approve pull requests, either enable Settings → Actions → General → Workflow permissions → 'Allow GitHub Actions to create and approve pull requests', or set the CATALOG_SYNC_TOKEN secret to a PAT / GitHub App token with contents: write and pull-requests: write."
            } >&2
            exit 1
          fi
