name: Catalog & Rankings Sync

on:
  schedule:
    # Run daily at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      force_resync:
        description: 'Force re-syncing from all upstream registries'
        required: false
        type: boolean
        default: false

concurrency:
  group: catalog-sync
  cancel-in-progress: false

jobs:
  sync-catalog:
    name: Sync Registries & Refresh Rankings
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Sync upstream catalog & rank scores
        run: |
          echo "Syncing skills (agentskills.io, skills.sh) and MCP servers (mcpservers.org, registry)..."
          python3 scripts/build_full_catalog.py

      - name: Rebuild materialized catalog release pointer
        run: |
          go run ./cmd/litespm catalog build --out web/public

      - name: Check catalog coherence
        run: |
          python3 scripts/check_catalog_coherence.py

      - name: Verify Web Build
        working-directory: ./web
        run: |
          npm ci
          npm run build

      - name: Commit & Push Catalog Updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if [[ -n $(git status --porcelain) ]]; then
            git add data/ web/public/v1/ web/src/
            git commit -m "chore(catalog): automated sync of skills, mcps, and rankings [skip ci]"
            git push origin main
          else
            echo "No changes in catalog dataset or rankings."
          fi
