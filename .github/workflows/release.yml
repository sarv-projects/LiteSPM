name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  # Two consumers of this OIDC token: `npm publish --provenance` attests the
  # tarball against this workflow run, and `cosign sign-blob` mints the
  # keyless (Fulcio) certificates that sign every release artifact.
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    outputs:
      npm_published: ${{ steps.npm_publish.outputs.published }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Fail before building or creating a GitHub Release if the npm wrapper,
      # lockfile and source tag do not describe the same release. The binary is
      # compiled from this exact tag commit, so its schema migrations and CLI
      # commands must be the same source users install through npm.
      - name: Verify release version metadata
        run: |
          PACKAGE_VERSION="$(node -p "require('./npm/package.json').version")"
          LOCK_VERSION="$(node -p "require('./npm/package-lock.json').packages[''].version")"
          if [ "${PACKAGE_VERSION}" != "${LOCK_VERSION}" ]; then
            echo "::error::npm package version ${PACKAGE_VERSION} does not match lockfile version ${LOCK_VERSION}"
            exit 1
          fi
          if [ "v${PACKAGE_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::npm/package.json is v${PACKAGE_VERSION} but this release is ${GITHUB_REF_NAME}"
            exit 1
          fi
          echo "Release tag, npm package and lockfile all match v${PACKAGE_VERSION}"

      - name: Run Go Test Suite
        run: go test ./...

      - name: Compile Release Binaries
        run: |
          chmod +x scripts/build-release.sh
          export VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/build-release.sh

      - name: Build Web (standalone)
        working-directory: ./web
        run: |
          npm ci
          npm run build

      - name: Package Release Archives
        run: |
          mkdir -p release-assets
          cp dist/litespm-* dist/SHA256SUMS.txt release-assets/
          # The web app is a Next.js standalone server (next.config.ts:
          # output: "standalone"), not a static export. postbuild copies
          # .next/static and public into .next/standalone; outputFileTracing
          # includes web/data. Package exactly that tree.
          test -f web/.next/standalone/server.js
          test ! -e web/.next/standalone/.env
          tar --exclude='./.env' --exclude='./.env.*' -czf release-assets/litespm-web-standalone.tar.gz -C web/.next/standalone .
          if tar -tzf release-assets/litespm-web-standalone.tar.gz | grep -Eq '(^|/)\.env(\.|$)'; then
            echo "refusing to publish a web archive containing .env" >&2
            exit 1
          fi

      # Keyless Sigstore signing: every published artifact — binaries, the
      # checksum listing, the web archive — gets a short-lived Fulcio
      # certificate bound to THIS workflow run (identity:
      # https://github.com/<owner>/<repo>/.github/workflows/release.yml@refs/tags/<tag>,
      # issuer: https://token.actions.githubusercontent.com). That gives
      # `litespm self-update` a signer identity to check instead of a bare
      # SHA-256 shipped in the same channel as the binary it protects.
      # No long-lived signing key exists to rotate or leak.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign release artifacts (cosign keyless)
        run: |
          set -euo pipefail
          cd release-assets
          for f in litespm-* SHA256SUMS.txt; do
            case "$f" in *.sigstore.json) continue ;; esac
            [ -f "$f" ] || continue
            echo "signing $f"
            # One self-contained bundle per artifact: signature, Fulcio
            # certificate, and transparency-log proof. Verification is
            # `cosign verify-blob --bundle <file>.sigstore.json` (see
            # internal/trust and `litespm self-update`).
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done

      # A CycloneDX SBOM of the assets exactly as published, uploaded with
      # them so the artifact list is inspectable without trusting the release
      # notes. (A second, lockfile-derived SBOM path exists in
      # internal/trust for `litespm.lock` consumers.)
      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: release-assets
          format: cyclonedx
          output-file: release-assets/litespm-sbom.cdx.json
          upload-artifact: false

      # Nothing public is created until the installer tests have passed. The
      # release is created as a DRAFT (visible only to repository writers, its
      # tag and assets not downloadable by the public) so the assets are
      # uploaded and inspectable, and is published at the very end of this job,
      # after `npm publish` succeeded. A failure anywhere in between leaves a
      # draft to inspect or delete, never a public release with a broken
      # installer behind it.
      - name: Create GitHub Release (draft)
        id: gh_release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: true
          prerelease: false

      # The installer is what every `npm install -g litespm` runs, so the
      # release is gated on its refusal paths. The assets of a draft are not
      # publicly downloadable, so the cases that verify the signed bundle for
      # THIS tag read the assets this run just built and cosign-signed from
      # LITESPM_TEST_RELEASE_DIR instead of fetching them: the signatures are
      # the real keyless ones and are still checked against the real Sigstore
      # trust root and the pinned workflow identity. In release mode, missing
      # or unreadable assets are fatal rather than skips.
      - name: Test npm Wrapper and Installer
        working-directory: ./npm
        env:
          # A release pipeline must never publish npm after silently skipping
          # the real binary, checksum-manifest and Sigstore-bundle checks.
          LITESPM_TEST_REQUIRE_RELEASE: "1"
          LITESPM_TEST_RELEASE_DIR: ${{ github.workspace }}/release-assets
        run: |
          npm ci --ignore-scripts
          npm test

      # The npm tarball must carry the project license and notices. The canonical
      # files live at the repository root; copy them into ./npm so the `files`
      # allowlist in npm/package.json packs them.
      - name: Stage license files for npm
        run: cp LICENSE NOTICE npm/

      # Deliberately after the (draft) GitHub release has its assets and after
      # the installer tests: the npm postinstall fetches the v<version> assets,
      # so publishing before they exist would ship a package whose binary
      # download 404s. The release is made public in the step after this job's
      # npm steps, which keeps the window between the two to seconds.
      #
      # NODE_AUTH_TOKEN is scoped to this step only: a job-level env would
      # expose the token to every preceding step (build, test, packaging).
      #
      # This step must never be a *silent* skip. A release published to GitHub
      # but not to npm leaves every npm-installed user on an older binary, and
      # that is exactly the v0.4.0 incident (the tag predated the shard-aware
      # client, so `npm i -g litespm` could not sync the published tree at
      # all). The token check therefore fails the job loudly rather than
      # skipping, unless the release is deliberately marked npm-free with the
      # repository variable ALLOW_NPM_SKIP=true.
      - name: Publish npm package
        id: npm_publish
        working-directory: ./npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          ALLOW_NPM_SKIP: ${{ vars.ALLOW_NPM_SKIP }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            if [ "${ALLOW_NPM_SKIP}" = "true" ]; then
              echo "::warning title=NPM publish skipped::NPM_TOKEN is absent and ALLOW_NPM_SKIP=true, so this release is deliberately GitHub-only. Every npm-installed user stays on the previous version."
              exit 0
            fi
            echo "::error title=NPM publish required::NPM_TOKEN is absent. Publishing to GitHub alone would leave every npm-installed user on an older binary (the v0.4.0 incident). Set the NPM_TOKEN secret, or set the repository variable ALLOW_NPM_SKIP=true to publish to GitHub deliberately without npm."
            exit 1
          fi
          printf '//registry.npmjs.org/:_authToken=%s\n' "${NODE_AUTH_TOKEN}" > .npmrc
          npm publish --provenance --access public
          echo "published=true" >> "${GITHUB_OUTPUT}"

      # The token file must not survive the job regardless of outcome:
      # a failed publish must not leave .npmrc on disk for a later step.
      - name: Remove npm auth token
        if: always()
        run: rm -f npm/.npmrc

      # The last step: only now, with the installer tested and the package
      # published, does the release become public. It runs on success() only,
      # so a failed test or publish leaves the draft in place. GITHUB_TOKEN
      # (contents: write) is scoped to this step; retried because losing this
      # call after a successful npm publish would leave npm pointing at assets
      # nobody can download.
      - name: Publish GitHub Release (un-draft)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.gh_release.outputs.id }}
        run: |
          # Address the draft by its numeric id: `gh release edit <tag>` looks a
          # release up by tag, which the API does not serve for drafts.
          if [ -z "${RELEASE_ID}" ]; then
            RELEASE_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
              --jq ".[] | select(.draft and .tag_name == \"${GITHUB_REF_NAME}\") | .id" | head -n1)"
          fi
          if [ -z "${RELEASE_ID}" ]; then
            echo "::error::No draft release found for ${GITHUB_REF_NAME}"
            exit 1
          fi
          for attempt in 1 2 3 4 5; do
            if gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
                 -F draft=false -f make_latest=true >/dev/null; then
              echo "Release ${GITHUB_REF_NAME} is public."
              exit 0
            fi
            echo "gh release edit failed (attempt ${attempt}/5); retrying in $((attempt * 5))s"
            sleep $((attempt * 5))
          done
          echo "::error::Could not publish the draft release ${GITHUB_REF_NAME}. npm may already be published; publish the draft release by hand (id ${RELEASE_ID})"
          exit 1

  # Proves the thing users actually do, on the three platforms they do it on,
  # after everything is public: `npm i -g litespm@<version>` (which runs the
  # postinstall, downloading and Sigstore-verifying the released binary) and
  # then `litespm --version`. The registry needs a moment to serve a fresh
  # version, so both the lookup and the install are retried for up to ~5
  # minutes.
  smoke:
    name: Smoke (${{ matrix.os }})
    needs: build-and-release
    if: needs.build-and-release.outputs.npm_published == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install from npm and run
        shell: bash
        run: |
          set -u
          VERSION="${GITHUB_REF_NAME#v}"
          deadline=$((SECONDS + 300))
          attempt=0
          until npm i -g "litespm@${VERSION}"; do
            attempt=$((attempt + 1))
            if [ "${SECONDS}" -ge "${deadline}" ]; then
              echo "::error::litespm@${VERSION} could not be installed within 5 minutes (${attempt} attempts)"
              exit 1
            fi
            echo "npm i -g litespm@${VERSION} not ready yet (attempt ${attempt}); retrying in 15s"
            sleep 15
          done
          out="$(litespm --version)"
          echo "${out}"
          case "${out}" in
            *"${VERSION}"*) echo "litespm ${VERSION} runs on ${RUNNER_OS}" ;;
            *) echo "::error::'litespm --version' printed '${out}', expected it to contain ${VERSION}"; exit 1 ;;
          esac
