name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-checks:
    name: Static Checks (gofmt, vet, scripts)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Check gofmt Formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      # go.mod is part of the review surface: a direct import marked
      # `// indirect`, or a tidy that was never run, is drift. The check
      # rewrites nothing a reviewer would not get from `go mod tidy`.
      - name: Check go.mod Is Tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check Shell Script Syntax
        run: bash -n scripts/*.sh

      - name: Byte-compile Python Scripts
        run: python3 -m py_compile scripts/*.py

      # The producer's own test suites exercise the ingestion safety rules
      # (host allowlists, DNS pinning, redirect and size bounds), the snapshot
      # lifecycle, skill promotion and the mcpmarket crawl logic. They were
      # manual-only until now, which meant a regression in any of them reached
      # a release without a signal. They run offline: every suite feeds canned
      # bytes through a patched fetcher, so this step needs no network and
      # cannot flake on an upstream.
      - name: Run Python Test Suites
        run: |
          for suite in scripts/test_*.py; do
            echo "::group::$suite"
            python3 "$suite"
            echo "::endgroup::"
          done

      - name: Check Node.js Entry Points
        run: |
          node --check npm/bin/litespm.js
          node --check npm/scripts/install-binary.js

      # The installer is the only place this project executes a downloaded
      # native binary, so its refusal paths are tested rather than assumed.
      # --ignore-scripts: the package's own postinstall downloads and verifies
      # the published binary, which the tests exercise deliberately. Running it
      # here would only add a second, redundant network fetch.
      - name: Test npm Wrapper and Installer
        run: |
          cd npm && npm ci --ignore-scripts && npm test

      # The committed dataset is the input to every published release. Nothing
      # else in CI touched it, so an edit that made the dataset un-compilable
      # (duplicate or unsafe listing ids) or that drifted from the released tree
      # would only surface at deploy time, on the machine doing the deploying.
      # --materialize reproduces the released pointer byte for byte from the
      # committed dataset, so this is a reproducibility check, not a network one.
      - name: Verify Dataset Reproduces the Released Tree
        run: |
          go run ./cmd/litespm catalog build \
            --materialize \
            --out "${{ runner.temp }}/release-check" \
            --prev web/public/v1/current.json
          go run ./cmd/litespm catalog build --verify "${{ runner.temp }}/release-check"

      # The two JSON registries are emitted from the compiled-in Go host
      # adapters (scripts/gen_hosts_ts.go). An
      # adapter edit that is not regenerated shows up as a stale compatibility
      # matrix on the public site and as snippets that disagree with what the
      # binary actually writes, so the generator is re-run here and the tree
      # must come back byte-identical.
      - name: Verify Generated Host Data Is Current
        run: |
          go run scripts/gen_hosts_ts.go
          git diff --exit-code -- web/data/hosts.json web/data/skill-targets.json

  # The npm package is what users install, and Windows is where its install
  # path differs most (file locking, .cmd shims, %USERPROFILE%). This job packs
  # the tarball exactly as `npm publish` would, installs it with
  # --ignore-scripts (the postinstall would download the *published* binary,
  # which does not exist for an unreleased commit), then proves the packed
  # wrapper resolves and runs a binary built from this commit. The managed
  # binary is placed by the repo's installer through the explicit
  # LITESPM_ALLOW_LOCAL_DIST=1 opt-in, in a throwaway HOME.
  npm-package-windows:
    name: npm Package (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run npm Unit Tests
        working-directory: ./npm
        run: |
          npm ci --ignore-scripts
          npm test

      - name: Build Windows Binary From This Commit
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $version = node -p "require('./npm/package.json').version"
          go build -ldflags "-X main.Version=$version" -o dist/litespm-windows-amd64.exe ./cmd/litespm

      - name: Pack, Install Tarball (--ignore-scripts) and Run
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sbx = Join-Path $env:RUNNER_TEMP 'litespm-sbx'
          $home_ = Join-Path $sbx 'home'
          $prefix = Join-Path $sbx 'prefix'
          New-Item -ItemType Directory -Force $home_, $prefix | Out-Null

          Push-Location npm
          $tgz = (npm pack --silent | Select-Object -Last 1).Trim()
          Pop-Location
          npm install -g (Join-Path (Resolve-Path npm) $tgz) --ignore-scripts --prefix $prefix
          if ($LASTEXITCODE -ne 0) { throw "npm install -g failed" }

          # Never the runner's real profile.
          $env:USERPROFILE = $home_
          $env:HOME = $home_
          $env:LITESPM_ALLOW_LOCAL_DIST = '1'
          $env:LITESPM_NO_AUTO_SYNC = '1'

          node npm/scripts/install-binary.js
          if ($LASTEXITCODE -ne 0) { throw "local-dist install failed" }

          $installed = Join-Path $prefix 'node_modules\litespm'
          node (Join-Path $installed 'bin\litespm.js') --version
          if ($LASTEXITCODE -ne 0) { throw "packed wrapper failed to run the binary" }
          & (Join-Path $prefix 'litespm.cmd') --version
          if ($LASTEXITCODE -ne 0) { throw "litespm.cmd shim failed" }

  test-go:
    name: Test Go Engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # -shuffle=on makes test order a variable rather than an assumption:
      # the suite has already caught one ordering-sensitive defect, and a
      # green run that only works in declaration order is not a green run.
      - name: Run Go Test Suite
        run: go test -v -race -shuffle=on ./...
        if: matrix.os != 'windows-latest'

      - name: Run Go Test Suite (Windows)
        run: go test -v -shuffle=on ./...
        if: matrix.os == 'windows-latest'

      - name: Stress Windows lock contention
        if: matrix.os == 'windows-latest'
        run: go test -v -count=20 -run 'Test(StaleRecoveryRetriesWindowsSharingViolation|ConcurrentAcquireIsMutuallyExclusive)$' ./internal/fslock

  build-web:
    name: Build Next.js Web Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Web Dependencies
        working-directory: ./web
        run: bun install --frozen-lockfile

      - name: Type-check Web
        working-directory: ./web
        run: bun run type-check

      - name: Lint Web
        working-directory: ./web
        run: bun run lint

      - name: Web Hardening Regression Tests
        working-directory: ./web
        run: bun run test:hardening

      - name: Host Platform Path Tests
        working-directory: ./web
        run: bun run test:host-paths

      - name: Build Web Application
        working-directory: ./web
        run: bun run build

      - name: Verify Standalone Output
        run: test -f web/.next/standalone/server.js
