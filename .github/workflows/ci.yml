name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-checks:
    name: Static Checks (gofmt, vet, scripts)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Check gofmt Formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      # go.mod is part of the review surface: a direct import marked
      # `// indirect`, or a tidy that was never run, is drift. The check
      # rewrites nothing a reviewer would not get from `go mod tidy`.
      - name: Check go.mod Is Tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check Shell Script Syntax
        run: bash -n scripts/*.sh

      - name: Byte-compile Python Scripts
        run: python3 -m py_compile scripts/*.py

      # The producer's own test suites exercise the ingestion safety rules
      # (host allowlists, DNS pinning, redirect and size bounds), the snapshot
      # lifecycle, skill promotion and the mcpmarket crawl logic. They were
      # manual-only until now, which meant a regression in any of them reached
      # a release without a signal. They run offline: every suite feeds canned
      # bytes through a patched fetcher, so this step needs no network and
      # cannot flake on an upstream.
      - name: Run Python Test Suites
        run: |
          for suite in scripts/test_*.py; do
            echo "::group::$suite"
            python3 "$suite"
            echo "::endgroup::"
          done

      - name: Check Node.js Entry Points
        run: |
          node --check npm/bin/litespm.js
          node --check npm/scripts/install-binary.js

      # The installer is the only place this project executes a downloaded
      # native binary, so its refusal paths are tested rather than assumed.
      # test_npm.js needs a binary to resolve, so one is built first and dropped
      # in dist/ under the name the wrapper looks for.
      #
      # --ignore-scripts: the package's own postinstall downloads and verifies
      # the published binary, which the tests exercise deliberately. Running it
      # here would only add a second, redundant network fetch.
      - name: Test npm Wrapper and Installer
        run: |
          go build -o "dist/$(node -p "require('./npm/bin/litespm.js').getBinaryName()")" ./cmd/litespm
          cd npm && npm ci --ignore-scripts && npm test

      # The committed dataset is the input to every published release. Nothing
      # else in CI touched it, so an edit that made the dataset un-compilable
      # (duplicate or unsafe listing ids) or that drifted from the released tree
      # would only surface at deploy time, on the machine doing the deploying.
      # --materialize reproduces the released pointer byte for byte from the
      # committed dataset, so this is a reproducibility check, not a network one.
      - name: Verify Dataset Reproduces the Released Tree
        run: |
          go run ./cmd/litespm catalog build \
            --materialize \
            --out "${{ runner.temp }}/release-check" \
            --prev web/public/v1/current.json
          go run ./cmd/litespm catalog build --verify "${{ runner.temp }}/release-check"

      # web/lib/hosts.ts and the two JSON registries it imports are emitted
      # from the compiled-in Go host adapters (scripts/gen_hosts_ts.go). An
      # adapter edit that is not regenerated shows up as a stale compatibility
      # matrix on the public site and as snippets that disagree with what the
      # binary actually writes, so the generator is re-run here and the tree
      # must come back byte-identical.
      - name: Verify Generated Host Data Is Current
        run: |
          go run scripts/gen_hosts_ts.go
          git diff --exit-code -- web/data/hosts.json web/data/skill-targets.json web/lib/hosts.ts

  test-go:
    name: Test Go Engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # -shuffle=on makes test order a variable rather than an assumption:
      # the suite has already caught one ordering-sensitive defect, and a
      # green run that only works in declaration order is not a green run.
      - name: Run Go Test Suite
        run: go test -v -race -shuffle=on ./...
        if: matrix.os != 'windows-latest'

      - name: Run Go Test Suite (Windows)
        run: go test -v -shuffle=on ./...
        if: matrix.os == 'windows-latest'

  build-web:
    name: Build Next.js Static Export
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # cosign's keyless flow mints a Fulcio certificate from this workflow's
      # OIDC token, which requires id-token: write. Without it the deploy
      # script skips signing (and says so).
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Nothing else compares these three files to each other: the dataset and
      # the release stats are written by the Python producer, the pointer by the
      # Go builder, so the site can describe a catalog the pointer does not name
      # while every other check stays green. Runs before the build so a
      # disagreement fails fast and names the file.
      - name: Check Catalog Coherence
        run: python3 scripts/check_catalog_coherence.py

      # scripts/deploy-pages.sh materializes the release tree with the Go
      # builder, so packaging it here requires the Go toolchain too.
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # deploy-pages.sh signs /v1/current.json when a signing identity exists;
      # the OIDC token is that identity (cosign keyless). Fork PRs receive no
      # token, and the script's skip branch covers them.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Web Dependencies
        working-directory: ./web
        run: npm ci

      - name: Type-check Web
        working-directory: ./web
        # Runs the script rather than the raw command so `npm run type-check`
        # — which `lib/hosts.ts` already refers to — cannot rot unnoticed.
        run: npm run type-check

      - name: Lint Web
        working-directory: ./web
        # `next lint` hung here: no ESLint config, no eslint dependency, and an
        # interactive prompt when stdin is not a TTY, so it could never pass.
        # The script now checks the one rule that has actually bitten this
        # codebase — a Hook below an early return, which React reports as #310
        # and which both `tsc` and `next build` accept. See scripts/README.md.
        run: npm run lint

      - name: Build Web Static Export
        working-directory: ./web
        run: npm run build

      - name: Verify Static Output
        run: test -f web/out/index.html

      # The product links are checked against the export that was just built.
      #
      # The gate used to be part of `npm run lint`, and CI runs the lint
      # BEFORE the static export exists — so it either found no bundle to read
      # or failed on the missing directory, and the check that exists to keep
      # a link from naming a product the catalog does not have was not
      # actually running on the bundle. It runs here, on the real export, and
      # the deploy script runs it again on the packaged tree.
      - name: Check Product Links
        working-directory: ./web
        run: npm run lint:links

      # Package the bundle exactly as scripts/deploy-pages.sh does — export,
      # drop the copied /v1, materialize the released tree — and then judge it
      # with the same audit script the deploy runs. This is what catches a source
      # map in the export or a release tree that no longer matches its pointer,
      # before either reaches the CDN.
      - name: Package and Audit the Deploy Bundle
        run: |
          chmod +x scripts/*.sh
          ./scripts/deploy-pages.sh

  # `next build` proves the export compiles; it does not prove the exported
  # site works. Every UI defect this repository has found in its review passes
  # was found by hand — a cold load of `/package/?slug=…` serving the generic
  # "Entry detail" shell (the flagship GitHub MCP server included), Reset
  # leaving filters in the address bar, the ⌘K palette's fetch contract, a
  # no-JS loading chip that never resolves, board figures that disagreed with
  # the pages their own links opened. This job serves the built export through
  # the real edge Worker (`web/tests/serve.mjs`, Miniflare — the runtime
  # wrangler embeds) and runs the Playwright suite against it, including the
  # budgets (CLS, same-origin request count, First Load JS, 390px overflow)
  # and a contrast pass.
  browser-regression:
    name: Browser Regression (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Node 22, not the web job's 20: the test server runs Miniflare 5, whose
      # own engines field requires >=22 — the same runtime wrangler 4.151
      # embeds, pinned to the same version in web/package.json.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Web Dependencies
        working-directory: ./web
        run: npm ci

      # ~170 MB of browser per runner; keyed on the lockfile so a Playwright
      # bump refetches and nothing else does.
      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install Playwright Browser
        working-directory: ./web
        run: npx playwright install --with-deps chromium

      # The suite asserts on `web/out` — the bytes that ship — through the
      # Worker that ships with them, so the build is a prerequisite, not an
      # alternative to running against a dev server.
      - name: Build Web Static Export
        working-directory: ./web
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Run Browser Regression Suite
        working-directory: ./web
        run: npx playwright test

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
