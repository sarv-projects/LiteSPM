name: Release journey verification
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  release-journey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build CLI
        run: go build -o dist/litespm ./cmd/litespm
      - name: Test source resolution and real local installation
        run: |
          go test ./internal/skills ./cmd/litespm
          scripts/test_cli_journey.sh dist/litespm
          python3 scripts/test_mcp_journey.py dist/litespm
      - name: Preserve reproducible source and CLI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-journey-source
          path: |
            web/data/catalog.json
            dist/litespm
          retention-days: 3
