# The website is a Next.js standalone app on Vercel. This origin owns the
# signed /v1 catalog release tree and redirects every other path to the app
# origin (WEB_ORIGIN below). See worker/index.js.
name = "litespm"
compatibility_date = "2026-09-01"

[vars]
WEB_ORIGIN = "https://lite-spm-nine.vercel.app"

main = "worker/index.js"

# Cloudflare Workers Static Assets. `pages_build_output_dir` was removed: it is
# a Pages-only field, and its presence made `wrangler deploy` warn that this was
# a "Pages project" on every build. This deployment is a Worker.
[assets]
directory = "./pages-dist"
binding = "ASSETS"
not_found_handling = "404-page"
# The Worker serves /v1 from the asset binding and redirects every other path
# to the app origin. Run it first for all requests; there is no HTML shell in
# pages-dist to serve directly.
run_worker_first = true
